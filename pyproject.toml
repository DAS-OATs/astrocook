[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astrocook"
version = "2.6.0"
description = "Python package for the analysis of quasar spectra"
readme = "README.md"
requires-python = ">=3.12"
# License: GPLv3, to be added with the LICENSE file (phase 2, ROADMAP.md)
#license = { file = "LICENSE" }
authors = [
  { name = "Guido Cupani", email = "guido.cupani@inaf.it" },
]
maintainers = [
  { name = "Guido Cupani", email = "guido.cupani@inaf.it" },
]
keywords = ["astronomy", "spectroscopy", "quasar", "science", "spectra"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    #"License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]

# Lower bounds: the oldest versions with Python 3.12 support where known;
# to be reviewed with the Dependabot alerts (F18, phase 2)
dependencies = [
    "PySide6>=6.10",
    "astropy>=6.1",
    "numpy>=1.26",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "numexpr",
    "qtawesome",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mock",
    "pytest-qt",
    "pytest-cov",
    # Parallel runs (pytest -n auto): the suite in ~3 minutes instead of ~7
    "pytest-xdist",
    # Used by the V1 reference of the parity tests (tests/reference/v1)
    "tqdm>=4.66",
]
# Bayesian fit (fitting/bayesian_fitter.py, gui/corner_plot.py): without
# them the fit raises an error naming this extra and the GUI disables its
# entries
bayes = [
    "emcee",
    "dynesty",
    "corner",
]
dev = [
    # Test dependencies plus development tools (linter, mutation testing);
    # the tests also cover the Bayesian fit and the MCP server
    "astrocook[test,bayes,mcp]",
    "ruff",
    "mypy",
    "mutmut",
]
# User documentation (docs/; generate_sphinx.sh, generate_html.sh,
# deploy_docs.sh)
docs = [
    "sphinx",
    "myst-parser",
    "sphinx-design",
    "pydata-sphinx-theme",
]
# macOS app (build_app.sh, Astrocook.spec), which includes the Bayesian
# fit; the DMG also needs create-dmg (brew install create-dmg)
build = ["pyinstaller", "astrocook[bayes]"]
# MCP server for agents (astrocook/mcp_server, ROADMAP_HISTORY.md section 4.1);
# the 2.x API differs from 1.x
# anyio >= 4.11: the heartbeat sends from its own thread (``token``)
mcp = ["mcp>=2.3,<3", "anyio>=4.11"]

[project.scripts]
# Launch the GUI: `astrocook [file ...]` (same as `python -m astrocook`)
astrocook = "astrocook._run_astrocook:main"
# MCP server for agents, over stdio (needs the [mcp] extra)
astrocook-mcp = "astrocook.mcp_server.server:main"
# Summary of the gaps of the collection of recipes recorded in a local file
astrocook-gaps = "astrocook.gaps:main"

[project.urls]
Homepage = "https://github.com/DAS-OATs/astrocook"
Repository = "https://github.com/DAS-OATs/astrocook"
Issues = "https://github.com/DAS-OATs/astrocook/issues"

[tool.setuptools]
# Ships astrocook/data (grafted in MANIFEST.in)
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["astrocook*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
minversion = "6.0"
# Show summary of all failures/errors/skips/xfails/xpasses at the end (-ra)
# Use quiet reporting (-q) or verbose (-v)
addopts = "-ra -q"
testpaths = [
    "tests", # Specifies where pytest should look for tests
]
markers = [
    "slow: long tests, skipped unless pytest is run with --run-slow",
]
# Every warning raised during a test is an error (phase 6, agreed with
# Guido): the suite gave 123 warnings, which nobody read. A test that
# expects a warning says so (pytest.warns, or warnings.catch_warnings with
# a local filter). When a new release of a dependency brings a warning,
# fix the code, or add an "ignore" entry below with its reason; never a
# global filter in the package.
filterwarnings = [
    "error",
    # The verbatim copy of V1 (tests/reference/v1, not to be edited) has an
    # invalid escape sequence in a docstring ("\Delta"): Python warns when it
    # compiles the file, so only without a cached .pyc, as in the CI. The
    # module of a warning of the compiler is the path of the file
    "ignore:invalid escape sequence:SyntaxWarning:.*reference.v1.cookbook_continuum_old",
]

# Type checker (phase 6-quater, PR 3): `mypy` with no arguments checks the
# packages below; core/, fitting/ and gui/ come in PR 4. The options are the
# default ones (no strict), apart from these two: the libraries without
# stubs are not an error, and the modules outside `files` are read for their
# types but not reported.
[tool.mypy]
files = ["astrocook/recipes", "astrocook/mcp_server", "astrocook/core", "astrocook/fitting", "astrocook/gui"]
ignore_missing_imports = true
follow_imports = "silent"

[tool.ruff]
# The verbatim copy of the V1 code for the parity tests and the V1 docs
# (deployed under /v1/ by deploy_docs.sh) are not linted
extend-exclude = ["tests/reference/v1", "docs_backup"]

[tool.ruff.lint]
# Pyflakes (F) and flake8-bugbear (B, phase 6-quater): likely bugs, not
# style; the style rules (E, W) are left out
select = ["F", "B"]

[tool.coverage.run]
source = ["astrocook"]
# Also measure the child processes (the full-chain snapshots run the chain
# in a subprocess, see tests/full_chain.py)
patch = ["subprocess"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

# Mutation testing (phase 1, item 6 of ROADMAP_HISTORY.md): run by hand, not in CI.
#   mutmut run --max-children 4; mutmut results; mutmut show <mutant>
# The GUI and full-chain tests are left out: slow, and the chain runs in a
# subprocess that the mutants do not reach.
[tool.mutmut]
source_paths = [
    "astrocook/core/spectrum_operations.py",
    "astrocook/fitting/voigt_model.py",
    "astrocook/fitting/voigt_fitter.py",
]
also_copy = ["astrocook/"]
pytest_add_cli_args_test_selection = [
    "tests/",
    "--ignore=tests/test_gui_smoke.py",
    "--ignore=tests/test_gui_save_session.py",
    "--ignore=tests/test_snapshots_full_chain.py",
    "-p", "no:cacheprovider",
]
