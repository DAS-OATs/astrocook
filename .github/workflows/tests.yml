name: Tests

on:
  push:
    branches: [master]
  pull_request:
  # Manual runs (Actions page), e.g. to run the slow tests on a PR branch
  workflow_dispatch:
  # Weekly run (Mondays, 05:17 UTC), to catch changes from new dependency
  # versions when nothing is committed
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install package
        run: pip install -e ".[dev]"

      # Coverage measured on one Python version only (report in the log)
      - name: Run tests
        run: pytest ${{ matrix.python-version == '3.13' && '--cov=astrocook --cov-report=term' || '' }}

  # Slow tests (full analysis chain on a real spectrum, ~15 minutes), on one
  # Python version only. Not on pull requests (the mock chain in the default
  # suite covers them): after each merge to master, weekly and on demand.
  slow:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run slow tests
        run: pytest --run-slow -m slow

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: pip install ruff==0.17.0

      # Only undefined names are blocking for now; the other pyflakes
      # warnings will be cleaned up in a dedicated PR (see ROADMAP.md).
      - name: Ruff (undefined names)
        run: ruff check --select F821 .
