name: Tests

on:
  push:
    branches: [master]
  pull_request:
  # Manual runs (Actions page), e.g. to run the slow tests on a PR branch
  workflow_dispatch:
  # Weekly run (Mondays, 05:17 UTC), to catch changes from new dependency
  # versions when nothing is committed
  schedule:
    - cron: "17 5 * * 1"

# A new push cancels the run in progress on the same PR; on master every
# run completes, so that two merges in a row do not cancel the slow tests
# of the first one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Pinned (11 November 2026): the ubuntu-latest runners moved to Ubuntu 26.04 and
    # apt-get failed there (security.ubuntu.com did not resolve)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt system libraries
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y -qq -o Acquire::Retries=3 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install package
        run: pip install -e ".[dev]"

      # In parallel, one process per core (pytest-xdist); coverage measured
      # on one Python version only (report in the log)
      - name: Run tests
        run: pytest -n auto ${{ matrix.python-version == '3.13' && '--cov=astrocook --cov-report=term' || '' }}

  # Slow tests (full analysis chain on a real spectrum, ~15 minutes), on one
  # Python version only. Not on pull requests (the mock chain in the default
  # suite covers them): after each merge to master, weekly and on demand.
  slow:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt system libraries
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y -qq -o Acquire::Retries=3 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run slow tests
        run: pytest --run-slow -m slow

  # Headless image of the MCP server (Dockerfile, phase 6-ter): built and
  # run, with the stdio check of tests/mcp_stdio_check.py inside it (open a
  # mock, a recipe, save, plot, gui_open refused). Only when what goes into
  # the image changes. The image is not published anywhere (GHCR waits for
  # the LICENSE, #549).
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Compare a pull request with its base (the full history is fetched
      # above; no third-party action for this)
      - name: What changed
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -q -E '^(Dockerfile|\.dockerignore|pyproject\.toml|astrocook/|tests/mcp_stdio_check\.py|\.github/workflows/tests\.yml)'; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
            echo "Nothing that goes into the image changed: not built."
          fi

      - name: Build the image
        if: steps.changes.outputs.image == 'true'
        run: docker build -t astrocook-mcp .

      # PySide6 must not be in the image
      - name: No PySide6 in the image
        if: steps.changes.outputs.image == 'true'
        run: |
          if docker run --rm --entrypoint pip astrocook-mcp list | grep -i -E "^(pyside6|shiboken6|qtawesome) "; then
            echo "the image holds the GUI dependencies"; exit 1
          fi

      # The check is a client: it starts astrocook-mcp inside the container
      - name: Run the server over stdio in the image
        if: steps.changes.outputs.image == 'true'
        run: |
          docker run --rm -v "$PWD/tests/mcp_stdio_check.py:/check.py:ro" \
            --entrypoint python astrocook-mcp /check.py -- astrocook-mcp

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: pip install ruff==0.17.0

      # All the rules configured in pyproject.toml (pyflakes for now)
      - name: Ruff
        run: ruff check .

  # Type checker (phase 6-quater): the whole package is installed, so that
  # the types of numpy, astropy and mcp are those the checks are written
  # against (without the [mcp] extra the server would be checked as Any)
  types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: pip install -e ".[dev]"

      # Packages and options in [tool.mypy] of pyproject.toml
      - name: Mypy
        run: mypy
