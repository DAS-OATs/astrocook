name: Docs

# Builds the website (build_site.sh) and publishes it on the gh-pages branch,
# served at https://das-oats.github.io/astrocook/. Same steps as
# deploy_docs.sh, which stays as a manual fallback.
on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "docs_backup/**"
      - "astrocook/**"
      - "CHANGELOG.md"
      - "switcher.json"
      - "build_site.sh"
      - "generate_sphinx.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# One deployment at a time; a newer one waits instead of cancelling a push
concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # autodoc imports the GUI modules
      - name: Install Qt system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install package
        run: pip install -e ".[docs]"

      - name: Build the site
        run: ./build_site.sh "$RUNNER_TEMP/site"

      # As deploy_docs.sh: the new files overwrite the old ones on gh-pages
      - name: Publish on gh-pages
        run: |
          git fetch --depth 1 origin gh-pages
          git worktree add "$RUNNER_TEMP/gh-pages" FETCH_HEAD
          cp -r "$RUNNER_TEMP/site"/. "$RUNNER_TEMP/gh-pages"/
          cd "$RUNNER_TEMP/gh-pages"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Deploy docs from ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
