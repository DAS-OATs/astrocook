# Publication on PyPI (first one: 2.9.1, November 2026).
#
# - A published GitHub release (not a pre-release) builds the package and
#   publishes it on PyPI.
# - A manual run (Actions page) publishes on TestPyPI, to try the chain
#   before a release: the version of TestPyPI cannot be reused, so bump it
#   (e.g. 2.9.1.dev1) for each try.
#
# No token is stored: PyPI and TestPyPI trust this workflow ("trusted
# publishing", OpenID Connect). It needs, on each index, a publisher for
# the project `astrocook`: owner DAS-OATs, repository astrocook, workflow
# publish.yml, environment `pypi` (PyPI) or `testpypi` (TestPyPI).
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - name: Check that the version is the one of the tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python - <<'PY'
          import tomllib
          print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])
          PY
          )
          if [ "v$version" != "$RELEASE_TAG" ] && [ "$version" != "$RELEASE_TAG" ]; then
            echo "pyproject.toml says $version, the tag is $RELEASE_TAG" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/astrocook/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/astrocook/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
